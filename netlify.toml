[build]
  command = "npm run export:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"
  EXPO_NO_TELEMETRY = "1"

# Expo Router runs client-side. Direct links and email callbacks need this fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
